name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify generated frontend contracts
        run: go run ./cmd/contractgen -check
      - name: Build embedded frontend
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: Audit Go and frontend dependencies
        run: make security
      - name: Test and vet
        run: go test -race ./... && go vet ./...
      - name: Test frontend source preservation and themes
        working-directory: web
        run: bun test
      - name: Install browser test runtime
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Test browser workflows
        working-directory: web
        run: bun run test:browser
      - name: Verify CGO-free deployment
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o bin/postbox-linux-amd64 ./cmd/postbox
          GOARCH=arm64 go build -trimpath -o bin/postbox-linux-arm64 ./cmd/postbox
